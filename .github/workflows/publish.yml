name: Publish
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

# Publishing uses external credentials (Maven Central secrets), not GITHUB_TOKEN
permissions:
  contents: read

# Never run two publishes concurrently (e.g. two tags pushed in quick succession)
concurrency:
  group: publish

jobs:
  # Mirrors the three-runner matrix of ci.yml so a tag on an unverified commit cannot publish
  # untested artifacts.
  verify:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            tasks: check detekt
          - os: macos-latest
            tasks: macosArm64Test iosSimulatorArm64Test tvosSimulatorArm64Test watchosSimulatorArm64Test
          - os: windows-latest
            tasks: mingwX64Test jvmTest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up JDK
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: 17
      - name: Set up gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
      - name: Check
        run: ./gradlew ${{ matrix.tasks }} --no-build-cache

  publish-maven-central:
    needs: verify
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up JDK
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: 17
      - name: Set up gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
      - name: Publish to maven central
        env:
          TAG_NAME: ${{ github.ref_name }}
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_PGP_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PGP_PASSWORD }}
        run: |
          PUBLISH_VERSION=${TAG_NAME#v}
          ./gradlew publishAndReleaseToMavenCentral --no-configuration-cache --no-build-cache -PpublishVersion="$PUBLISH_VERSION"
