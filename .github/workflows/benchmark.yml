name: Benchmark

# Manual-only: benchmark numbers from shared runners are for the Linux (x64) results section in
# benchmark/RESULTS.md; running them on every push would be wasted compute and noise.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
      - name: Run benchmarks
        run: ./gradlew :benchmark:jvmBenchmark :benchmark:jsBenchmark :benchmark:wasmJsBenchmark :benchmark:linuxX64Benchmark --no-build-cache
      - name: Record runner info
        run: |
          {
            grep -m1 "model name" /proc/cpuinfo
            echo "nproc: $(nproc)"
            grep MemTotal /proc/meminfo
            echo "runner image: $ImageOS $ImageVersion"
          } > benchmark/build/reports/benchmarks/runner-info.txt
          cat benchmark/build/reports/benchmarks/runner-info.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-results
          path: benchmark/build/reports/benchmarks/
